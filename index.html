<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fafa" />
    <meta name="description" content="Vuestro plan nutricional de Bocause, día a día." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bocause" />
    <title>Bocause</title>

    <!--
      Antiparpadeo: aplica el tema guardado antes del primer pintado. Tiene que ir aquí, en
      línea y antes de los estilos; si esperásemos a React, la recarga mostraría un fogonazo
      del tema anterior. La clave 'bocause.theme' se repite en src/features/theme/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bocause.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0b131d' : '#f7fafa');
        } catch (e) {
          /* almacenamiento bloqueado: se queda con el tema del sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
